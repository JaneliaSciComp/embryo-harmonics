[project]
name = "embryoharmonics"
version = "0.2.0"
description = "Analyzing biological data using harmonical analysis"
requires-python = ">= 3.12"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  {name = "Michael Innerberger", email = "innerbergerm@hhmi.org"},
]

dependencies = [
  "h5py",
  "numpy==2.2.0",
  "scipy",
  "matplotlib",
  "pyvista==0.44.2",
  "trame",
  "trame-vtk",
  "trame-vuetify",
  "tqdm",
  "jupyter",
  "ngsolve==6.2.2406",
  "webgui_jupyter_widgets",
]

[dependency-groups]
dev = ["pytest", "pytest-cov"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
